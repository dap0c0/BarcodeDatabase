# Comments are provided throughout this file to help you get started.
# If you need more help, visit the Docker Compose reference guide at
# https://docs.docker.com/go/compose-spec-reference/

# Here the instructions define your application as a service called "server".
# This service is built from the Dockerfile in the current directory.
# You can add other services your application may depend on here, such as a
# database or a cache. For examples, see the Awesome Compose repository:
# https://github.com/docker/awesome-compose
services:
  front_end:
    build:
      context: .
      dockerfile: ./Docker/front_end_server/Dockerfile
    image: front-end-image:latest
    ports:
      - 80
    restart: always
    secrets:
      # Automatically mount the contents of file from the
      # current working directory to the volume
      - item_server_url
    command: sh -c "python3.11 FrontEndServer.py -isuri $(cat /run/secrets/item_server_url)"

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    # Unfortunately, I didn't know
    # how to work around evaluation discrepency
    # of environment variables between the compose yaml and
    # the container. In this image, it is also impossible to cat
    # files. Hence, we don't mount secret volumes in this service; we use
    # a tedious and insecure workaround.
    command: tunnel --no-autoupdate run --token <insert token here>

# Secret volumes
secrets:
  item_server_url:
    file: item_server_url.txt
