# Note: I did not know how to mount a secret during build via the
# Dockerfile. Thus, it wasn't possible to set an entrypoint with the
# isuri such that we could add arguments in the cmdline interface.
# As a workaround, I've set two distinct services in this compose file:
# rc_crawler (scrape using the leaves in leaves/leaves.json) and
# leaf_extractor (scrape for leaves and set in leaves/leaves.json).
services:
  rc_crawler:
    build:
      context: .
      dockerfile: ./Docker/rc_crawler/Dockerfile
    image: rc-crawler-image:latest
    secrets:
      # Mount the contents of the secret file
      # from the current working directory
      # to the secret volume.
      - item_server_url
    command: sh -c "python3.11 page_it -isuri $(cat /run/secrets/item_server_url)"

  leaf_extractor:
    build:
      context: .
      dockerfile: ./Docker/rc_crawler/Dockerfile
    image: rc-crawler-image:latest
    secrets:
      # Mount the contents of the secret file
      # from the current working directory
      # to the secret volume.
      - item_server_url
    command: sh -c "python3.11 page_it -isuri $(cat /run/secrets/item_server_url) --grocery --home-beauty-baby --joe-fresh"

# Secret volumes
secrets:
  item_server_url:
    file: item_server_url.txt
